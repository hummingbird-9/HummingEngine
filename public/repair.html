<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HummingProxy storage repair</title><style>body{font:16px 'Segoe UI',sans-serif;background:#102d21;color:#e5ffed;max-width:680px;margin:8vh auto;padding:24px}button,a{background:#265d3d;color:#fff;border:1px solid #76b28a;border-radius:6px;padding:12px;display:inline-block;margin:8px 8px 8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#163d2b;padding:16px;border-radius:6px}</style></head><body><h1>Repair HummingProxy storage</h1><p>This page runs separately from Scramjet so its database connections can close before repair. Bookmarks and tabs saved in local storage will be kept.</p><pre id="log">Preparing repair…</pre><button id="retry" hidden>Reload and retry</button><button id="clearData" hidden>How to clear site data</button><a href="/">Return to HummingProxy</a><script>
const output=document.getElementById('log');
const retry=document.getElementById('retry');
const clearData=document.getElementById('clearData');
const say=message=>{output.textContent=message;};
const pause=ms=>new Promise(resolve=>setTimeout(resolve,ms));
const deleteDatabase=(name,timeout=12000)=>new Promise((resolve,reject)=>{
  let finished=false;
  const request=indexedDB.deleteDatabase(name);
  const timer=setTimeout(()=>{
    if(finished)return;
    finished=true;
    reject(new Error('Deletion of '+name+' is blocked by a database connection. It may be another HummingProxy tab, or a browser process that has not released the previous page yet.'));
  },timeout);
  const settle=(error)=>{
    if(finished)return;
    finished=true;
    clearTimeout(timer);
    if(error)reject(error);else resolve();
  };
  request.onblocked=()=>say('Waiting for '+name+' to be released. An old tab, service worker, or recently closed page may still hold it open…');
  request.onsuccess=()=>settle();
  request.onerror=()=>settle(request.error||new Error('Could not reset '+name));
});
async function repair(){
  retry.hidden=true;
  clearData.hidden=true;
  try{
    if(!('indexedDB'in window))throw new Error('IndexedDB is unavailable in this browser.');
    say('Unregistering HummingProxy service workers…');
    if('serviceWorker'in navigator){
      const registrations=await navigator.serviceWorker.getRegistrations();
      for(const registration of registrations){
        if(new URL(registration.scope).origin===location.origin)await registration.unregister();
      }
    }
    await pause(400);
    if(typeof indexedDB.databases!=='function')throw new Error('This browser cannot enumerate IndexedDB databases automatically.');
    const databases=await indexedDB.databases();
    const names=[...new Set(databases.filter(db=>typeof db.name==='string'&&/scramjet/i.test(db.name)).map(db=>db.name))];
    if(!names.length){
      say('No Scramjet-named databases were detected. If the missing-object-store error continues, use Chrome’s site-data controls for this website.');
      clearData.hidden=false;
      return;
    }
    for(const name of names){
      say('Resetting '+name+'…');
      await deleteDatabase(name);
    }
    say('Scramjet database reset completed. Return to HummingProxy to initialize a new database. Your saved bookmarks and tabs have not been cleared.');
  }catch(error){
    say('Repair could not complete: '+(error.message||String(error))+'\n\nClose any other HummingProxy tabs, including tabs running another version on this same domain. Then reload this repair page. If it remains blocked, clear this website’s site data in Chrome settings.');
    retry.hidden=false;
    clearData.hidden=false;
  }
}
retry.onclick=()=>location.reload();
clearData.onclick=()=>{
  say('In Chrome, open the icon to the left of this page’s address → Site settings → Clear data (or Settings → Privacy and security → Site settings → View permissions and data stored across sites). Search for this website and delete its data. This also removes saved tabs, bookmarks, and settings. Then reload HummingProxy.');
};
repair();

</script></body></html>
