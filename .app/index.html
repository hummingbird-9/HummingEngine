<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HummingEngine</title>
  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-surface: #1e293b;
      --bg-input: #111827;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --warning-border: #ef4444;
    }

    body {
      margin: 0;
      padding: 16px;
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    main {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--bg-surface);
      padding-bottom: 12px;
    }

    .app-avatar {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .brand-banner {
      height: 24px;
      object-fit: contain;
    }

    .control-card {
      background-color: var(--bg-surface);
      padding: 16px;
      border-radius: 4px;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .search-input {
      background-color: var(--bg-input);
      border: 1px solid var(--text-muted);
      color: var(--text-main);
      padding: 10px;
      border-radius: 2px;
      font-size: 15px;
      width: 100%;
      box-sizing: border-box;
    }

    .search-input:focus {
      outline: 1px solid var(--accent);
      border-color: var(--accent);
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 14px;
    }

    .radio-group, .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
    }

    .warning-box {
      border: 1px solid var(--warning-border);
      background-color: var(--bg-input);
      padding: 12px;
      border-radius: 2px;
    }

    .warning-title {
      color: var(--warning-border);
      font-weight: bold;
      margin-bottom: 4px;
      text-transform: uppercase;
      font-size: 12px;
      letter-spacing: 0.05em;
    }

    .warning-body {
      color: var(--text-main);
      font-size: 13px;
    }

    .action-btn {
      background-color: var(--accent);
      color: var(--bg-main);
      border: none;
      padding: 12px;
      font-weight: bold;
      border-radius: 2px;
      cursor: pointer;
      width: 100%;
      font-size: 14px;
    }

    .action-btn:active {
      opacity: 0.9;
    }
  </style>
</head>
<body>

<main>
  <header class="brand-header">
    <!-- Local relative graphic asset references -->
    <img src="hummingicon.png" alt="hummingengine avatar" class="app-avatar">
    <img src="hummingbirdtech.png" alt="hummingbirdtech logo banner" class="brand-banner">
  </header>

  <div class="warning-box">
    <div class="warning-title">System Alert</div>
    <div class="warning-body">Solve CAPTCHAs slowly because the hummingbird engine runs so fast it will trigger anti-bot loops.</div>
  </div>

  <section class="control-card">
    <form id="proxy-launch-form" onsubmit="return false;">
      <div class="input-group">
        <label for="search-input-field" style="font-weight: bold; color: var(--text-muted);">Destination String / URL</label>
        <input type="text" id="search-input-field" class="search-input" placeholder="Enter target search context or URL..." autocomplete="off">
      </div>

      <div class="options-grid">
        <div>
          <span style="display: block; font-weight: bold; margin-bottom: 6px; color: var(--text-muted);">Transport Protocol Engine</span>
          <div style="display: flex; gap: 16px;">
            <label class="radio-group">
              <input type="radio" name="transport" value="epoxy" checked> Epoxy (Wasm)
            </label>
            <label class="radio-group">
              <input type="radio" name="transport" value="libcurl"> libcurl
            </label>
            <label class="radio-group">
              <input type="radio" name="transport" value="tor"> Tor Routing
            </label>
          </div>
        </div>

        <div>
          <span style="display: block; font-weight: bold; margin-bottom: 6px; color: var(--text-muted);">Engine Flags</span>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <label class="checkbox-group">
              <input type="checkbox" id="flag-adblock"> Enable Velocity AdBlock (Inline Stripping)
            </label>
            <label class="checkbox-group">
              <input type="checkbox" id="flag-stealth"> Enable Stealth Session (Drop Worker Caching Logs)
            </label>
          </div>
        </div>
      </div>

      <div style="margin-top: 20px;">
        <button type="submit" id="launch-engine-btn" class="action-btn">Launch Request</button>
      </div>
    </form>
  </section>
</main>

<script type="module">
  // Local relative hook script link
  import hummingbirdEngine from './register-hook.js';

  document.getElementById('proxy-launch-form').addEventListener('submit', () => {
    const rawInput = document.getElementById('search-input-field').value;
    const targetUrl = hummingbirdEngine.processSearchInput(rawInput);
    
    if (!targetUrl) return;

    const transportMode = document.querySelector('input[name="transport"]:checked').value;
    const velocityAdBlock = document.getElementById('flag-adblock').checked;
    const stealthSession = document.getElementById('flag-stealth').checked;

    hummingbirdEngine.updateSettings({
      transportMode,
      velocityAdBlock,
      stealthSession
    });

    console.log(`[hummingengine] Forwarding to Scramjet runtime target: ${targetUrl}`);
  });
</script>

</body>
</html>
